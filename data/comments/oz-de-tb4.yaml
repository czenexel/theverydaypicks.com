      - name: "Dr. Stefan K."
        time: "2 T."
        likes: 87
        text: >-
          @Jonas Ich bin Lebensmittelchemiker, daher kann ich das erklären: Die Ozonkonzentration im Ozoori liegt bei etwa 0,02–0,05 ppm—deutlich unter dem als sicher geltenden Grenzwert von 0,1 ppm. Diese Technologie wird in der Lebensmittelindustrie seit Jahrzehnten in Kühllagern eingesetzt. Bei geschlossenem Kühlschrank zerfällt das Ozon ohnehin innerhalb von 20–30 Minuten wieder zu normalem Sauerstoff. Absolut unbedenklich.
