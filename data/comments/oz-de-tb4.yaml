    text: >-
      Moment mal—Ozon ist doch giftig, oder? Das ist genau das Gleiche, was im Smog steckt. Soll ich allen Ernstes ein Gerät, das Gift produziert, in meinen Kühlschrank stellen, direkt neben meine Lebensmittel? Das klingt für mich überhaupt nicht sicher...
