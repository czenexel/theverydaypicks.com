        time: "1 T."
        likes: 34
        text: >-
          @Dr. Stefan Danke für die ausführliche Erklärung! Das beruhigt mich. Ich habe es jetzt doch bestellt und bin begeistert. Der Käsegeruch ist tatsächlich weg 😅
