  - name: "Kevin Whitman"
    time: "6d"
    likes: 41
    text: >-
      Sorry but I'm not sold. "Titanium cutting board" sounds like a gimmick to charge C$50 for a glorified piece of metal. Anyone here actually have a science explanation or is this just marketing fluff?
    replies:
      - name: "Dr. Anna Reyes"
        time: "6d"
        text: >-
          Food microbiologist here, this is actually well-documented. Polyethylene cutting boards develop micro-fissures from knife cuts, and bacterial biofilms form inside those fissures within 48 hours of inoculation – they're essentially impossible to remove by surface washing. Titanium is non-porous and biocompatible (it's the same reason we use it in surgical implants), so there's nothing for biofilms to anchor to. The microplastic shedding from plastic boards is also a real phenomenon documented in a 2023 study in *Environmental Science & Technology* – grams of microplastic per year for a household. So no, it's not a gimmick. It's just chemistry that happens to also make a great cutting surface.
      - name: "Kevin Whitman"
        time: "5d"
        text: >-
          Well damn. Thanks for the actual explanation. Ordered one this morning. 😅
