  - name: "Kevin Whitman"
    time: "6T"
    likes: 41
    text: >-
      Sorry, aber ich bin nicht überzeugt. "Titan-Schneidebrett" klingt wie eine Masche, um 59,99 € für ein hochgejazztes Stück Metall zu verlangen. Hat hier irgendwer eine wissenschaftliche Erklärung oder ist das alles nur Marketing-Geschwurbel?
    replies:
      - name: "Dr. Anna Reyes"
        time: "6T"
        text: >-
          Lebensmittelmikrobiologin hier, das ist tatsächlich gut dokumentiert. Polyethylen-Schneidebretter entwickeln durch Messerschnitte Mikrorisse, und innerhalb von 48 Stunden nach Kontamination bilden sich darin bakterielle Biofilme – die sind durch normales Abwaschen praktisch nicht zu entfernen. Titan ist porenfrei und biokompatibel (aus dem gleichen Grund verwenden wir es ja für chirurgische Implantate), also haben Biofilme nichts, woran sie sich festsetzen könnten. Auch der Mikroplastik-Abrieb von Plastikbrettern ist ein reales Phänomen, dokumentiert in einer Studie von 2023 in *Environmental Science & Technology* – Gramm an Mikroplastik pro Jahr für einen Haushalt. Also nein, das ist keine Masche. Das ist einfach Chemie, die zufällig auch eine super Schneidefläche ergibt.
      - name: "Kevin Whitman"
        time: "5T"
        text: >-
          Na sowas. Danke für die richtige Erklärung. Heute Morgen eins bestellt. 😅
