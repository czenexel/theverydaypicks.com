    text: >-
      Ich kann es immer noch nicht glauben. Wir hatten JEDEN Sommer diese Fruchtfliegen-Plage – sobald man eine Banane gekauft hat, waren innerhalb von 2 Tagen hunderte von denen da. Essigfallen, Spüli-Tricks, alles probiert. Seit 3 Wochen steht der Ozoori neben dem Obstkorb und es ist einfach NICHTS mehr da. Keine einzige Fliege. Mein Mann dachte zuerst, ich hab das Obst heimlich weggeschmissen. 😂
    replies:
      - name: "Petra Langen"
        time: "1 T."
        text: >-
          Wie schnell hat das bei dir gewirkt? Bei uns ist es gerade unerträglich...
      - name: "Sabine K."
        time: "22 Std."
        verified: true
        text: >-
          Bei mir waren nach 2 Tagen schon deutlich weniger da und nach ca. 5 Tagen komplett weg. Die die schon da waren, sind quasi „geflohen“ und neue kamen nicht mehr nach. Bestell dir einfach eins, du wirst es nicht bereuen! 🙌
  - name: "Thomas Becker"
