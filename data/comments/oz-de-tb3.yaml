    text: >-
      Das Ding im Kühlschrank ist der absolute Gamechanger. Erdbeeren halten jetzt locker 5-6 Tage statt wie vorher 2. Paprika wird nicht mehr schrumpelig, Salat bleibt knackig. Hab ausgerechnet, dass wir im letzten Monat ca. 40€ weniger Lebensmittel weggeworfen haben. Das Gerät hat sich nach 6 Wochen komplett selbst bezahlt. 💪
    replies:
      - name: "Anja Richter"
        time: "3 T."
        text: >-
          Passt das Gerät einfach so in den Kühlschrank rein? Ist das nicht zu groß?
      - name: "Thomas Becker"
        time: "2 T."
        verified: true
        text: >-
          Ist super kompakt, so groß wie ein Ei ungefähr. Stell es einfach ins Gemüsefach oder auf eine Ablage. Fällt kaum auf und braucht kein Kabel – der Akku hält wochenlang. 👍
  - name: "Michael Groß"
    time: "5 T."
    likes: 34
    text: >-
      Sorry, aber das klingt für mich nach typischem Marketing-Blabla. „Molekulare Dekonstruktion“, „OzoSonic-Technologie“... Kann mir jemand erklären, warum das kein Humbug ist?
    replies:
      - name: "Dr. Markus Friedl"
        time: "5 T."
        text: >-
          Ich bin Lebensmittelchemiker und kann das einordnen: Ozon (O3) ist ein extrem starkes Oxidationsmittel, das nachweislich Bakterien, Viren und Pilzsporen abtötet. Das wird in der Lebensmittelindustrie seit Jahrzehnten eingesetzt – z.B. in Großlagern für Obst und Gemüse. Die Technologie ist also nicht neu, nur die Miniaturisierung für den Hausgebrauch. Das Gerät erzeugt kontrolliert kleine Mengen Ozon, die für Menschen völlig unbedenklich sind, aber für Mikroorganismen und Insektenlarven tödlich.
      - name: "Michael Groß"
        time: "4 T."
        text: >-
          Ok, danke für die sachliche Erklärung. Hab mir jetzt doch eins bestellt. Wenn ein Lebensmittelchemiker das sagt, probier ich's mal aus. 😅
