      Ik ben een thuiskok die écht om zijn messen geeft. Twee jaar geleden meer dan €600 uitgegeven aan een Shun-set en zag ze binnen 4 maanden bot worden op mijn oude plastic plank. Geslepen, weer bot. Geslepen, weer bot. Zes weken geleden overgestapt op Katori en de snede van mijn koksmes is NOG STEEDS hetzelfde als op de dag dat ik 'm voor het laatst sleep. Ik had geen idee dat plastic mijn lemmeten letterlijk aan het opvreten was. 💪
    replies:
      - name: "Megan O'Reilly"
        time: "4d"
        text: >-
          Wacht – maken plastic planken messen bot? Ik dacht dat dat alleen bij glas was?
      - name: "Robert Chen"
        time: "3d"
        verified: true
        text: >-
          Plastic is zacht, dus het trekt bij elke snee aan de snijkant. Glas en keramiek zijn nog veel erger (die beschadigen het lemmet), maar plastic is ook niet vriend van je messen. Titanium is precies hard genoeg om niet mee te bijten, maar niet zó hard dat het de snede beschadigt. Geloofde het zelf eerlijk gezegd ook niet tot ik het op mijn eigen messen zag. 👌
  - name: "Kevin Whitman"
    time: "6d"
    likes: 41
    text: >-
      Sorry maar ik ben niet overtuigd. "Titanium snijplank" klinkt als een truc om €39,90 te vragen voor een opgepoetst stukje metaal. Heeft iemand hier daadwerkelijk een wetenschappelijke uitleg of is dit gewoon marketingpraatjes?
    replies:
      - name: "Dr. Anna Reyes"
        time: "6d"
        text: >-
          Voedselmicrobioloog hier, dit is eigenlijk gewoon goed gedocumenteerd. Polyethyleen snijplanken ontwikkelen microscheurtjes door mesinkepingen, en bacteriële biofilms vormen zich binnen 48 uur na besmetting in die scheurtjes – die zijn met oppervlakkig wassen vrijwel onmogelijk te verwijderen. Titanium is niet-poreus en biocompatibel (om diezelfde reden gebruiken we het ook in chirurgische implantaten), dus er is letterlijk niets waar biofilms zich aan kunnen vasthechten. Het loslaten van microplastics uit plastic planken is ook een reëel fenomeen, gedocumenteerd in een studie uit 2023 in *Environmental Science & Technology* – grammen microplastic per jaar per huishouden. Dus nee, het is geen truc. Het is gewoon scheikunde die toevallig ook een uitstekend snijoppervlak oplevert.
      - name: "Kevin Whitman"
        time: "5d"
        text: >-
          Tjonge. Bedankt voor de échte uitleg. Vanochtend eentje besteld. 😅
