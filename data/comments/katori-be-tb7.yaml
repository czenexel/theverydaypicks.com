        text: >-
          Heb 'm nu bijna 5 maanden bij dagelijks intensief gebruik (ik kook elke avond) en er staat geen enkele zichtbare kras op. Titanium is écht een van de hardste metalen die er zijn. De Mohs-hardheid ligt hoger dan die van de meeste keukenmessen, dus het lemmet glijdt in plaats van zich erin te snijden. Die van mij ziet er nog precies zo uit als op de dag dat hij binnenkwam. Eerlijk het duurzaamste keukenstuk dat ik heb. 👍
