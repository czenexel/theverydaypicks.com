  - name: "Kevin Whitman"
    time: "6j"
    likes: 41
    text: >-
      Désolé mais je suis pas convaincu. "Planche à découper en titane" ça sonne comme un gadget pour facturer 39,90 € un bout de métal glorifié. Quelqu'un ici a une vraie explication scientifique ou c'est juste du blabla marketing ?
    replies:
      - name: "Dr. Anna Reyes"
        time: "6j"
        text: >-
          Microbiologiste alimentaire ici, c'est en fait bien documenté. Les planches en polyéthylène développent des micro-fissures à cause des coups de couteau, et des biofilms bactériens se forment à l'intérieur de ces fissures dans les 48 heures suivant l'inoculation – ils sont essentiellement impossibles à enlever par un simple lavage de surface. Le titane est non poreux et biocompatible (c'est la même raison pour laquelle on l'utilise dans les implants chirurgicaux), donc il n'y a rien sur quoi les biofilms puissent s'ancrer. La libération de microplastiques par les planches en plastique est aussi un phénomène réel documenté dans une étude de 2023 dans *Environmental Science & Technology* – des grammes de microplastique par an pour un foyer. Donc non, c'est pas un gadget. C'est juste de la chimie qui fait en plus une excellente surface de coupe.
      - name: "Kevin Whitman"
        time: "5j"
        text: >-
          Eh ben mince. Merci pour l'explication concrète. J'en ai commandé une ce matin. 😅
