<!DOCTYPE html>
<html lang="{{ .Params.htmlLang | default .Site.Language.Lang | default "en" }}">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   {{ if .Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}
   <link rel="icon" type="image/x-icon" href="/favicon.ico">
   <title>{{ .Title }} | {{ .Site.Title }}</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
   <style>
      :root {
      --font-primary: 'Montserrat', sans-serif;
      --color-text: #111111;
      --color-heading: #333333;
      --color-link: #167ac6;
      --color-background: #fff;
      --color-footer-bg: #1b1b1b;
      --color-footer-text: #ffffff;
      --color-border: #e5e7eb;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { line-height: 1.7; scroll-behavior: smooth; }
      body { font-family: var(--font-primary); font-size: 1rem; color: var(--color-text); background-color: var(--color-background); min-height: 100vh; display: flex; flex-direction: column; }
      h1, h2, h3 { font-family: var(--font-primary); color: var(--color-heading); font-weight: 700; line-height: 1.2; margin-top: 2rem; margin-bottom: 1rem; }
      h1 { font-size: 1.75rem; color: #0d244f; font-weight: 800; }
      h2 { font-size: 1.375rem; }
      p { margin-bottom: 1.25rem; }
      a { color: var(--color-link); font-weight: 600; text-decoration: underline; }
      a:hover { text-decoration: none; }
      .page-container { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 1.5rem 1rem 3rem; text-align: left; }
      .site-logo { display: block; max-width: 200px; height: auto; margin-bottom: 1.5rem; }
      .page-content { font-size: 0.95rem; line-height: 1.6; color: #2a2a2a; }
      .page-content p { margin-bottom: 0.5rem; }
      .page-content ul, .page-content ol { padding-left: 1.5rem; margin-bottom: 1.25rem; }
      .page-content li { margin-bottom: 0.35rem; }
      .page-content table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.875rem; line-height: 1.5; }
      .page-content thead th { background-color: #f5f5f5; font-weight: 700; text-align: left; padding: 10px 12px; border: 1px solid #ddd; }
      .page-content tbody td { padding: 10px 12px; border: 1px solid #ddd; vertical-align: top; }
      .page-content tbody tr:nth-child(even) { background-color: #fafafa; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 1.5rem; }
      .table-wrap table { margin-bottom: 0; min-width: 600px; }
      .page-footer { background-color: var(--color-footer-bg); color: var(--color-footer-text); padding: 2.5rem 1rem; font-size: 1rem; }
      .footer-container { max-width: 800px; margin: 0 auto; text-align: center; }
      .footer-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem 1.5rem; margin-bottom: 2rem; }
      .footer-link { color: var(--color-footer-text); font-weight: 400; text-decoration: none; opacity: 0.7; transition: opacity 0.3s ease; }
      .footer-link:hover { text-decoration: underline; opacity: 1; }
      .footer-copyright { font-size: 0.875rem; opacity: 0.6; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.5rem; margin-top: 1.5rem; }
      @media (min-width: 770px) { h1 { font-size: 2.25rem; } }
      @media (max-width: 769px) { .site-logo { width: 160px; } }
   </style>
</head>
<body>
   <div class="page-container">
      <a href="/"><img src="https://imagedelivery.net/ARaXQ-_BUK-z-dKds3F61Q/6a1977cd-c8b6-4f21-beb1-3a6e41f8b700/logo" alt="TheVeryDayPicks" class="site-logo"></a>
      <h1>{{ .Title }}</h1>
      <div class="page-content">
         {{ .Content }}
      </div>
   </div>
   <footer class="page-footer">
      <div class="footer-container">
         <nav class="footer-nav">
            {{ range (.Params.footerLinks | default site.Params.footerLinks) }}
            <a href="{{ .url }}" class="footer-link">{{ .text }}</a>
            {{ end }}
         </nav>
         <div class="footer-copyright">
            &copy; {{ now.Format "2006" }} {{ .Site.Title }}. All Rights Reserved.
         </div>
      </div>
   </footer>
   <script>
      document.querySelectorAll('.page-content table').forEach(function(t){
         var w=document.createElement('div');w.className='table-wrap';
         t.parentNode.insertBefore(w,t);w.appendChild(t);
      });
   </script>
</body>
</html>
