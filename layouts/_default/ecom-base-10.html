<!doctype html>
<html lang="{{ .Params.htmlLang | default "de" }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }}</title>
<meta property="og:title" content="{{ .Title }}">
<meta property="og:type" content="article">
<style>
*,:after,:before{box-sizing:border-box}
body{background-color:#fff;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:1.1rem;font-weight:400;line-height:1.75;margin:0;-webkit-font-smoothing:antialiased}
h2,h3{color:#1a1a1a;font-weight:700;line-height:1.2;margin-block-end:1rem;margin-block-start:.5rem}
p{margin-block-end:.9rem;margin-block-start:0}
a{color:#c36;text-decoration:none}
b,strong{font-weight:700}
img{border:none;border-radius:0;box-shadow:none;height:auto;max-width:100%}

.adv-label{background-color:#f0f0f0;text-align:center;padding:8px 0;font-size:11px;color:#999;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid #e5e5e5}

.layout-wrapper{max-width:820px;margin:0 auto;padding:20px 16px}
.main-content{min-width:0}

.article-meta{font-size:13px;color:#888;margin:18px 0 30px;padding-bottom:22px;border-bottom:1px solid #ece9e0;letter-spacing:0.3px}
.article-body h2{font-size:42px;font-weight:800;margin:10px 0 14px;color:#0a0a0a;line-height:1.08;letter-spacing:-0.8px}
.article-body .subtitle{font-size:19px;color:#4a4a4a;line-height:1.55;margin-bottom:8px;font-weight:400}
.article-body h3{font-size:32px;font-weight:800;margin:48px 0 16px;color:#0a0a0a;letter-spacing:-0.3px;position:relative;padding-top:14px}
.article-body h3:before{content:'';display:block;width:48px;height:3px;background:#e8842a;border-radius:2px;margin-bottom:18px;position:absolute;top:0;left:0}
.article-body p{margin-bottom:14px;line-height:1.75;color:#2a2a2a}
.article-body img.article-img{width:100%;border-radius:10px;margin:28px 0;box-shadow:0 4px 22px rgba(0,0,0,.07)}
.article-body video.article-video{width:100%;border-radius:10px;margin:28px 0;display:block;background:#000;box-shadow:0 4px 22px rgba(0,0,0,.08)}
.article-body blockquote{border-left:4px solid #b88b3a;padding:20px 26px 18px;margin:22px 0;background:#fdf9f3;border-radius:0 10px 10px 0;font-style:normal;color:#3a2d18;line-height:1.72;font-size:17px}
.article-body blockquote strong{color:#0a0a0a;display:block;margin-top:14px;font-size:14px;font-weight:700;letter-spacing:0.2px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}
.step-box{background:#fff;border:1px solid #ece9e0;border-radius:14px;padding:24px 18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.step-box .step-num{width:34px;height:34px;border-radius:50%;background:#e8842a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;margin-bottom:12px}
.step-box .step-title{font-weight:800;font-size:17px;color:#0a0a0a;margin-bottom:6px;display:block}
.step-box p{font-size:14.5px;color:#5a5a5a;margin:0;line-height:1.5}

.week-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}
.week-box{background:#fff;border:1px solid #ece9e0;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.week-box img{width:100%;display:block;margin:0}
.week-box .week-cap{padding:14px 16px 16px}
.week-box .week-tag{display:inline-block;background:#e8842a;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.week-box .week-cap p{font-size:14.5px;color:#5a5a5a;margin:0;line-height:1.5}

.alert-box{background:linear-gradient(135deg,#fff8f0 0%,#fdf0e2 100%);border:1px solid #e8b878;border-left:5px solid #e8842a;border-radius:12px;padding:26px 30px;margin:32px 0;position:relative;box-shadow:0 4px 18px rgba(232,132,42,.10)}
.alert-box h3{color:#b15a13;margin-top:0;margin-bottom:14px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding-top:0}
.alert-box h3:before{display:none}
.alert-box p{margin-bottom:12px;font-size:17.5px;line-height:1.65;color:#3a2a14}
.alert-box p:last-child{margin-bottom:0}
.alert-box p strong{color:#0a0a0a}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}
.stat-box{background:#fff;border:1px solid #ece9e0;border-radius:14px;padding:24px 12px 20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:transform .2s}
.stat-box:hover{transform:translateY(-2px)}
.stat-box .num{font-size:36px;font-weight:800;color:#c46d15;display:block;line-height:1;letter-spacing:-1.2px;font-feature-settings:'tnum'}
.stat-box .label{font-size:13px;color:#5a5a5a;margin-top:10px;display:block;line-height:1.35;font-weight:500}

.cta-full{display:block;width:100%;padding:24px 22px;background:linear-gradient(135deg,#e8842a 0%,#d76e1a 100%);color:#fff;text-align:center;border:none;border-radius:10px;cursor:pointer;text-decoration:none;margin:32px 0;transition:all .2s;box-shadow:0 6px 20px rgba(232,132,42,.32)}
.cta-full:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(232,132,42,.42);color:#fff}
.cta-full .cta-main{display:block;font-size:23px;font-weight:800;line-height:1.25;letter-spacing:-0.2px}
.cta-full .cta-sub{display:block;font-size:13px;font-weight:500;margin-top:7px;color:rgba(255,255,255,.92)}

.urgency-box{background:#fff;border:1px solid #ece9e0;border-radius:14px;padding:28px 30px;margin:36px 0;box-shadow:0 4px 18px rgba(0,0,0,.05);position:relative;overflow:hidden}
.urgency-box:before{content:'';position:absolute;top:0;left:0;bottom:0;width:5px;background:linear-gradient(180deg,#e8842a 0%,#c33 100%)}
.urgency-box h3{color:#0a0a0a;margin-top:0;margin-bottom:16px;font-size:22px;font-weight:800;padding-top:0;letter-spacing:-0.3px}
.urgency-box h3:before{display:none}
.urgency-box p{margin-bottom:10px;font-size:16px;line-height:1.6;color:#2a2a2a}
.urgency-box p:last-child{margin-bottom:0}
.urgency-box p strong{color:#0a0a0a}

.fc-comments{max-width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:#1c1e21;margin-top:30px}
.fc-header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ddd;margin-bottom:12px}
.fc-header-title{font-weight:700;font-size:15px}
.fc-header-sort{font-size:12px;color:#65676b;cursor:pointer}
.fc-thread{margin-bottom:4px}
.fc-comment{padding:10px 0}
.fc-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px}
.fc-name{font-weight:700;color:#1c1e21}
.fc-time{color:#65676b}
.fc-bubble{background:#f0f2f5;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;color:#1c1e21}
.fc-actions{padding:4px 14px;font-size:12px;color:#65676b}
.fc-action{cursor:pointer}
.fc-reply{margin-left:40px}

.disclosure-section{max-width:820px;margin:0 auto;padding:30px 20px;font-size:11px;color:#999;line-height:1.7}
.footer-bar{background:#222;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;max-width:100%;flex-wrap:wrap;gap:10px}
.footer-bar p{color:#999;font-size:12px;margin:0}
.footer-links{display:flex;gap:16px;list-style:none;padding:0;margin:0}
.footer-links a{color:#999;font-size:12px;text-decoration:none}
.footer-links a:hover{color:#fff}
.divider{border:0;border-top:1px solid #e5e5e5;margin:0}

@media(max-width:600px){
  body{font-size:1.05rem;line-height:1.6}
  .layout-wrapper{padding:12px}
  .article-body h2{font-size:30px;line-height:1.15}
  .article-body .subtitle{font-size:16px}
  .article-body h3{font-size:24px}
  .cta-full{padding:16px;margin:24px 0}
  .cta-full .cta-main{font-size:19px}
  .cta-full .cta-sub{font-size:12px}
  .fc-bubble{font-size:13px;padding:8px 12px}
  .fc-reply{margin-left:20px}
  .footer-bar{flex-direction:column;text-align:center;gap:8px}
  .urgency-box{padding:18px 16px}
  .stat-row{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .week-grid{grid-template-columns:1fr}
  .stat-box .num{font-size:22px}
}
</style>
</head>
<body>

<div class="adv-label">{{ .Params.advertorialDisclosure | default "advertorial" }}</div>

<div class="layout-wrapper">
  <div class="main-content">
    <div class="article-body">
{{ .Content }}
    </div>
  </div>
</div>

<hr class="divider">

{{ with .Params.disclaimer }}
<div class="disclosure-section">{{ . | markdownify }}</div>
{{ end }}

<div class="footer-bar">
  <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}. Alle Rechte vorbehalten.</p>
  {{ with .Params.footerLinks }}
  <ul class="footer-links">{{ range . }}<li><a href="{{ .url }}">{{ .text }}</a></li>{{ end }}</ul>
  {{ end }}
</div>

</body>
</html>
